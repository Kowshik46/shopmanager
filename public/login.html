<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pharmacy Manager — Login</title>
<style>
  body { font-family: system-ui, sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; background: #f4f4f5; }
  form { background: #fff; padding: 2rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; gap: 1rem; width: 260px; }
  h1 { font-size: 1.1rem; margin: 0 0 0.5rem; }
  input { padding: 0.6rem; font-size: 1rem; border: 1px solid #ccc; border-radius: 4px; }
  button { padding: 0.6rem; font-size: 1rem; background: #2563eb; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #1d4ed8; }
  #error { color: #dc2626; font-size: 0.9rem; min-height: 1.2em; }
</style>
</head>
<body>
  <form id="login-form">
    <h1>Pharmacy Manager</h1>
    <input type="password" id="password" placeholder="Password" autofocus required autocomplete="current-password" />
    <div id="error"></div>
    <button type="submit">Log in</button>
  </form>
  <script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = document.getElementById('password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password }),
      });
      if (res.ok) {
        window.location.href = '/';
      } else {
        const data = await res.json().catch(() => ({}));
        errorEl.textContent = data.error || 'Login failed';
      }
    });
  </script>
</body>
</html>
